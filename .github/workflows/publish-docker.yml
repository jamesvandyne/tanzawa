name: Publish Docker image

# Builds and pushes ghcr.io/rmdes/tanzawa for both linux/amd64 and linux/arm64.
# Uses native GitHub-hosted runners per arch (no QEMU emulation) → faster
# than single-runner QEMU, and avoids occasional emulator flakiness on cairo /
# uWSGI native compiles.
#
# Tagging strategy (handled by docker/metadata-action):
#   push to main         → latest, sha-<short>
#   push of v1.2.3 tag   → 1.2.3, 1.2, 1, latest
#   pull_request         → builds but does not push (validates the build)
#   workflow_dispatch    → manual trigger (uses ref's tags above)
#
# Security note: all expression outputs used inside `run:` blocks are routed
# through `env:` to prevent command injection from any upstream-controlled
# value (digests, tags, computed names). Branches from forks never reach
# push/manifest steps thanks to the pull_request guards.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths:
      - deploy/Dockerfile
      - deploy/bootstrap.sh
      - apps/**
      - front/**
      - static/**
      - requirements*.txt
      - requirements.lock
      - .github/workflows/publish-docker.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,     arch: amd64 }
          - { runner: ubuntu-24.04-arm,  arch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name (lowercase)
        id: img
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          outputs: |
            type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.platform.arch }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # Validate digest format before using it as a filename — buildx
          # outputs should always be sha256:<hex>, but enforce it explicitly.
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Unexpected digest format: $DIGEST"
            exit 1
          fi
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name (lowercase)
        id: img
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMG: ${{ steps.img.outputs.name }}
          # DOCKER_METADATA_OUTPUT_JSON is set automatically by metadata-action
        run: |
          # Build "-t image:tag1 -t image:tag2 …" from metadata-action's JSON
          # output. metadata-action validates tag chars, but we still parse the
          # JSON through jq (not via shell expansion) to avoid any injection.
          mapfile -t TAG_ARGS < <(jq -r '.tags[] | "-t\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          # Each digest file is named sha256:<hex> stripped of the prefix.
          # Validate before composing the imagetools command.
          SRCS=()
          for f in *; do
            if [[ ! "$f" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Unexpected digest filename: $f"
              exit 1
            fi
            SRCS+=("${IMG}@sha256:${f}")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${SRCS[@]}"

      - name: Inspect resulting manifest
        env:
          IMG: ${{ steps.img.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMG}:${VERSION}"
